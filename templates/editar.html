<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

    <h1>Editar Produto</h1>

    <form action="/atualizar/{{ produto[0] }}" method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" value="{{ produto[1] }}" required>

        <label>Quantidade:</label>
        <input type="number" name="quantidade" value="{{ produto[2] }}" required>

        <label>Preço:</label>
        <input type="number" step="0.01" name="preco" value="{{ produto[3] }}" required>

        <button type="submit">Salvar alterações</button>

    </form>

    <a href="/" class="voltar">Voltar</a>

    </div>
</body>

</html>
